# Cloudflare Worker 配置（123-sync，和 abc-sync 互相独立）。部署步骤：
#   cd cloud
#   npx wrangler login
#   npx wrangler d1 create 123-sync            # 把输出里的 database_id 填到下面
#   npx wrangler d1 execute 123-sync --remote --file=schema.sql
#   npx wrangler deploy                        # 输出的 https://123-sync.<你的子域>.workers.dev 填进 js/core/sync.js 的 SYNC_URL
name = "123-sync"
main = "worker.mjs"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "123-sync"
database_id = "342eaa16-c2a0-4d78-b1e9-f0375ffd690d"

# 可选：只允许你的网页来源访问（逗号分隔）。不填就不限制（有同步码才能读写，不填也安全）。
# [vars]
# ORIGINS = "https://alexlee-xz.github.io"
